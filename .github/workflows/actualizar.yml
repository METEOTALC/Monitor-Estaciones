name: Actualizar Estaciones Met

on:
  schedule:
    # Se ejecutará automáticamente cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Instalar dependenciasde zona horaria
        run: pip install tzdata

      - name: Ejecutar script de monitoreo
        run: python index.py

      - name: Guardar cambios y actualizar repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de estaciones [skip ci]" && git push)
